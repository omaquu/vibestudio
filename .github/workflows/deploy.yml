name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7

      - name: Build WASM
        run: dx build --platform web --release

      - name: Fix asset paths for GitHub Pages
        run: |
          cd dist
          # Replace root-relative paths with base path for GitHub Pages
          find . -name "*.html" -exec sed -i 's|href="/|href="/vibestudio/|g' {} \;
          find . -name "*.html" -exec sed -i 's|src="/|src="/vibestudio/|g' {} \;
          # Also fix JS references
          find . -name "*.js" -exec sed -i 's|fetch("/|fetch("/vibestudio/|g' {} \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
